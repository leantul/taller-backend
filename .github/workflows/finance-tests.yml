name: Finance regression tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'frontend/**'
      - '.github/workflows/finance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # PostgreSQL Testcontainers tests must execute, not silently skip without Docker.
      - name: Backend tests including real PostgreSQL finance queries
        run: ./mvnw -B test
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-test-reports
          path: target/surefire-reports/
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
