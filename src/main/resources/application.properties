spring.application.name=taller

# PostgreSQL local/cloud
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tallerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456789}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin1234!}
app.bootstrap.admin.fullname=${BOOTSTRAP_ADMIN_FULLNAME:Administrador Taller}

logging.level.root=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
