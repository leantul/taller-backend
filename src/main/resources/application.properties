spring.application.name=taller

# PostgreSQL local/cloud
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tallerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Security
# JWT_SECRET is required in every runtime. Use a long random value and never commit it.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# Bootstrap admin credentials should come from environment, never from committed defaults.
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.fullname=${BOOTSTRAP_ADMIN_FULLNAME:Administrador Taller}

logging.level.root=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
