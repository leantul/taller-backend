<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Taller Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="assets/env.js"></script>
  <script>
    // Apply theme before Angular boots so CSS variables are available from the first paint.
    // Without this, :root has no --text/--bg/etc. until Angular's ThemeService.initTheme() runs,
    // causing charts and table elements to render with missing colors.
    (function() {
      try {
        var stored = localStorage.getItem('theme-mode');
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
