services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tallerdb}
      POSTGRES_USER: ${POSTGRES_USER:-taller_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-db-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/tallerdb}
      DB_USERNAME: ${DB_USERNAME:-taller_dev}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-local-db-password}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET antes de levantar el backend}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Define BOOTSTRAP_ADMIN_USERNAME en tu entorno}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD en tu entorno}
      BOOTSTRAP_ADMIN_FULLNAME: ${BOOTSTRAP_ADMIN_FULLNAME:-Administrador Taller}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
      AUTH_URL: ${AUTH_URL:-http://localhost:8080/auth}
    ports:
      - "4200:80"

volumes:
  postgres_data:
