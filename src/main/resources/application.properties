spring.application.name=taller

# Business timestamps are stored as local wall-clock values.
app.time-zone=${APP_TIME_ZONE:America/Argentina/Buenos_Aires}

# PostgreSQL local/cloud
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tallerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Bound database and HTTP concurrency so small containers retain native-memory headroom.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:40}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:50}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Security
# JWT_SECRET is required in every runtime. Use a long random value and never commit it.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
# Bootstrap admin credentials should come from environment, never from committed defaults.
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.fullname=${BOOTSTRAP_ADMIN_FULLNAME:Administrador Taller}

logging.level.root=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.frontend-url=${FRONTEND_URL:https://taller-backend-nine.vercel.app}
